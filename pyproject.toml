[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e3former"
version = "1.0.0"
description = "Energy-Adaptive Equivariant State Space Models for Protein Structure Representation"
requires-python = ">=3.10,<3.11"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.1.0", "torch-geometric==2.4.0", "e3nn==0.5.1",
  "torch-scatter==2.1.2", "torch-sparse==0.6.18", "torch-cluster==1.6.3",
  "graphein==1.7.5", "lightning==2.0.7", "pytorch-lightning==2.0.7",
  "torchmetrics==1.2.0", "numpy==1.23.5", "pandas==1.5.3",
  "hydra-core==1.3.2", "omegaconf==2.3.0", "beartype==0.15.0",
  "jaxtyping==0.2.24", "einops==0.6.1", "biotite==0.37.0",
  "scikit-learn==1.7.2", "loguru>=0.7,<0.8", "python-dotenv>=1,<2",
  "rich>=13,<14", "psutil>=5.9", "wandb==0.15.12",
  "pydantic==1.10.26", "bioservices==1.11.2", "fastapi==0.103.2",
  "lightning-cloud==0.5.37",
]

[project.optional-dependencies]
baselines = ["fair-esm==2.0.0", "torchdrug==0.2.1"]
hub = ["huggingface-hub==1.3.2"]
dev = ["pytest>=7,<9", "ruff==0.14.3"]

[project.scripts]
e3former = "e3former.cli:main"

[tool.setuptools.packages.find]
include = ["e3former*", "proteinworkshop*"]
namespaces = true

[tool.setuptools.package-data]
proteinworkshop = ["config/**/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
